name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate metadata and generated catalogs
        run: |
          python3 scripts/validate.py
          python3 scripts/render.py --check

  awesome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lint the curated README
        run: npx --yes awesome-lint@latest

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,403,429
            --exclude "^https://ojs\\.aaai\\.org/"
            --exclude "^https://anonymous\\.4open\\.science/r/PerSyn-8D85"
            "**/*.md"
          fail: true
