name: Add a paper
description: Propose a verified paper, technical report, tutorial, or survey.
title: "[Paper] "
labels: [paper]
body:
  - type: markdown
    attributes:
      value: >-
        Please read the primary source and the repository taxonomy before submitting.
  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Current full title
    validations:
      required: true
  - type: input
    id: primary
    attributes:
      label: Primary paper URL
      description: Use arXiv, DOI, or an official proceedings page, not a search result or secondary list.
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: stable_id
    attributes:
      label: Stable ID
      placeholder: arxiv:2608.19098
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: First public date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: collection
    attributes:
      label: Primary collection
      options:
        - Multi-teacher on-policy distillation
        - Offline multi-teacher distillation
        - Adjacent or alternative paradigm
        - Single-teacher foundation
        - Review or tutorial
    validations:
      required: true
  - type: dropdown
    id: record_type
    attributes:
      label: Record type
      options:
        - Method
        - Analysis
        - System report
        - Survey
        - Tutorial
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Three-part classification evidence
      description: >-
        State (1) who generates the trained-on states, (2) whether multiple independent supervisors exist,
        and (3) which teacher signal directly updates the student. Point to the relevant paper section.
      placeholder: |
        Student-generated states: yes/no/partial, because ...
        Multiple independent supervisors: yes/no/partial, because ...
        Direct distillation objective: yes/no/partial, because ...
    validations:
      required: true
  - type: textarea
    id: facets
    attributes:
      label: Proposed facets
      description: Include training regime, state source, teacher topology, primary mechanism, secondary mechanisms, signals, and domains.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: One-sentence contribution
      description: Describe the mechanism neutrally; avoid marketing or isolated benchmark claims.
    validations:
      required: true
  - type: input
    id: artifacts
    attributes:
      label: Official artifacts
      description: Leave blank unless the author or project connection is explicit.
      placeholder: https://github.com/...
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the title, stable ID, and primary URL for duplicates.
          required: true
        - label: I checked the paper itself, not only a snippet or secondary list.
          required: true
        - label: I did not infer peer-review status from an arXiv page.
          required: true
