<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Multi-Teacher Distillation — method map</title><desc id="desc">Compare on-policy multi-teacher distillation, offline multi-teacher distillation, and adjacent methods. Training states, teachers and objectives define collection boundaries; routing, weighting and conflict handling are separate mechanism facets.</desc>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F8FAFC" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0B766E" text-anchor="start">
<tspan x="56" y="54.875">A RESEARCH MAP</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="56" y="122.5">Multi-Teacher Distillation</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="56" y="167.875">Classify the training states first. Then examine teachers, objectives and mechanisms.</tspan>
</text>
<rect x="56" y="204" width="424" height="488" rx="12" fill="#EAF4F1" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B766E" text-anchor="start">
<tspan x="84" y="265.25">On-policy</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="84" y="302.75">Multi-teacher distillation (MOPD)</tspan>
</text>
<rect x="84" y="326" width="368" height="1" rx="0" fill="#CEDBE1" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0B766E" text-anchor="start">
<tspan x="84" y="363.875">TRAINING STATES</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="84" y="395.625">Current / near-current rollouts</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="84" y="424.0">Generated by the student policy.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0B766E" text-anchor="start">
<tspan x="84" y="457.875">SUPERVISORS</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="84" y="489.625">Multiple teacher sources</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="84" y="518.0">Independently identifiable teachers.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0B766E" text-anchor="start">
<tspan x="84" y="551.875">LEARNING SIGNAL</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="84" y="583.625">Direct distillation objective</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="84" y="612.0">Teacher signals update the student.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B766E" text-anchor="start">
<tspan x="84" y="668.5">All three criteria are required.</tspan>
</text>
<rect x="508" y="204" width="424" height="488" rx="12" fill="#EDF3FA" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#285A91" text-anchor="start">
<tspan x="536" y="265.25">Offline</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="536" y="302.75">Multi-teacher distillation</tspan>
</text>
<rect x="536" y="326" width="368" height="1" rx="0" fill="#CEDBE1" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#285A91" text-anchor="start">
<tspan x="536" y="363.875">TRAINING STATES</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="536" y="395.625">Fixed corpus or teacher data</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="536" y="424.0">Static examples or cached supervision.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#285A91" text-anchor="start">
<tspan x="536" y="457.875">SUPERVISORS</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="536" y="489.625">Multiple teacher sources</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="536" y="518.0">Independently identifiable teachers.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#285A91" text-anchor="start">
<tspan x="536" y="551.875">LEARNING SIGNAL</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="536" y="583.625">Offline distillation objective</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="536" y="612.0">Match outputs, features or examples.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#285A91" text-anchor="start">
<tspan x="536" y="668.5">Live scoring alone is not on-policy.</tspan>
</text>
<rect x="960" y="204" width="424" height="488" rx="12" fill="#EFF2F5" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#596674" text-anchor="start">
<tspan x="988" y="265.25">Adjacent</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="988" y="302.75">Related methods and boundary cases</tspan>
</text>
<rect x="988" y="326" width="368" height="1" rx="0" fill="#CEDBE1" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#596674" text-anchor="start">
<tspan x="988" y="363.875">SELF / EMA TEACHERS</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="988" y="395.625">One model’s history or smoothing</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="988" y="424.0">Alone, not an independent pool.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#596674" text-anchor="start">
<tspan x="988" y="457.875">SAMPLES / SINGLE-TEACHER ROLES</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="988" y="489.625">More rollouts, roles or views</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="988" y="518.0">Check the underlying teacher sources.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#596674" text-anchor="start">
<tspan x="988" y="551.875">HISTORICAL REPLAY</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="988" y="583.625">Saved student-generated states</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="988" y="612.0">Past rollouts may be off-policy.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#596674" text-anchor="start">
<tspan x="988" y="668.5">Apply the three tests to each method.</tspan>
</text>
<rect x="56" y="724" width="1328" height="1" rx="0" fill="#CEDBE1" stroke="none"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="56" y="769.375">Mechanism is a separate axis</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="56" y="807.0">How teachers are combined can vary</tspan>
<tspan x="56" y="827.0">within either multi-teacher collection.</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="510" y="769.5">Routing &amp; selection</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="510" y="807.0">Which teacher supervises</tspan>
<tspan x="510" y="827.0">each example or token?</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="810" y="769.5">Adaptive weighting</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="810" y="807.0">How much influence does</tspan>
<tspan x="810" y="827.0">each teacher receive?</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#142A3B" text-anchor="start">
<tspan x="1110" y="769.5">Conflict handling</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="1110" y="807.0">How is incompatible</tspan>
<tspan x="1110" y="827.0">supervision reconciled?</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526875" text-anchor="start">
<tspan x="56" y="875.625">Read the training loop: a title alone does not establish on-policy or multi-teacher supervision.</tspan>
</text>
</svg>